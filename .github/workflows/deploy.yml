name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/food-purchase-manager
            git pull origin main
            npm ci
            npm run build
            rm -rf /var/www/food-purchase/*
            cp -r dist/* /var/www/food-purchase/
            cp backend/package.json /opt/food-purchase/backend/
            cp backend/server.js /opt/food-purchase/backend/
            cp -r backend/routes/* /opt/food-purchase/backend/routes/
            cd /opt/food-purchase/backend
            npm ci --production
            # 数据库迁移：确保 purchase_records 表有 department_id 和 department_name 字段
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              ALTER TABLE purchase_records 
              ADD COLUMN IF NOT EXISTS department_id VARCHAR(36),
              ADD COLUMN IF NOT EXISTS department_name VARCHAR(50),
              ADD INDEX IF NOT EXISTS idx_department (department_id);
            " 2>/dev/null || true
            sudo systemctl restart food-purchase-backend
            sleep 3
            curl -s http://127.0.0.1:3001/api/health || exit 1
            echo "✅ Deployment successful"
