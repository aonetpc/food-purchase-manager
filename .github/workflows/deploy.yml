name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 各 job 所需的 GitHub Secrets：
#   SSH_HOST / SSH_USER / SSH_PRIVATE_KEY — SSH 登录目标服务器
#   DB_PASSWORD — 数据库密码（通过 ssh-action envs 注入，不写入服务器磁盘）
#   DB_USER / DB_NAME / DB_HOST — 可选（如与默认值 food_purchase / food_purchase / localhost 不同才配置）

jobs:
  # ================================================================
  # Job 1/5: ci-check — 在 GitHub runner 编译/类型检查，所有 push & PR 都跑
  #         坏代码卡在这里，不进入部署阶段。
  # ================================================================
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

  # ================================================================
  # Job 2/5: deploy-frontend — 只构建 + 部署 dist/ 到 Nginx 静态目录
  # ================================================================
  deploy-frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Deploy frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            # 本地 runner 已经 build 好，这里通过 scp？不可行。
            # 回到老方案：在服务器 git fetch + reset + build（确保 dist 在服务器侧生成）
            cd ~/food-purchase-manager
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            sudo rm -rf /var/www/food-purchase/*
            sudo cp -r dist/* /var/www/food-purchase/
            sudo chown -R ubuntu:ubuntu /var/www/food-purchase
            echo "✅ Frontend deployed"

  # ================================================================
  # Job 3/5: deploy-backend — rsync 同步后端代码 + 安装生产依赖
  #         通过安全门：.env 必须先就位
  # ================================================================
  deploy-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/food-purchase-manager
            git fetch origin main
            git reset --hard origin/main

            # --- .env 安全门：缺失则中止，旧后端进程不被触动 ---
            if [ ! -f /opt/food-purchase/backend/.env ]; then
              echo "❌ ABORT: /opt/food-purchase/backend/.env 不存在。"
              echo "   请先创建 .env（含 DB_PASSWORD 等）后再触发部署。"
              exit 1
            fi

            # 后端代码同步：rsync 一行替代逐文件 cp，新增文件自动覆盖
            sudo rsync -a --delete \
              --exclude node_modules \
              --exclude uploads \
              --exclude 'backup_*.sql' \
              --exclude '.env' \
              backend/ /opt/food-purchase/backend/
            sudo chown -R ubuntu:ubuntu /opt/food-purchase/backend

            # 运行时目录
            sudo -u ubuntu mkdir -p /opt/food-purchase/backend/uploads/pdfs
            sudo chown -R ubuntu:ubuntu /opt/food-purchase/backend/uploads

            # 安装生产依赖
            cd /opt/food-purchase/backend
            npm ci --production
            echo "✅ Backend synced & dependencies installed"

  # ================================================================
  # Job 4/5: migrate — 唯一迁移入口 migrate.js up
  # ================================================================
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-backend
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_HOST: ${{ secrets.DB_HOST }}
    steps:
      - name: Run migrations via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_PASSWORD,DB_USER,DB_NAME,DB_HOST
          command_timeout: 30m
          script: |
            set -e
            export DB_PASSWORD="${DB_PASSWORD}"
            export DB_USER="${DB_USER:-food_purchase}"
            export DB_NAME="${DB_NAME:-food_purchase}"
            export DB_HOST="${DB_HOST:-localhost}"

            if [ -z "$DB_PASSWORD" ]; then
              echo "❌ ABORT: DB_PASSWORD secret 未配置。请在 GitHub → Settings → Secrets 新增 DB_PASSWORD。"
              exit 1
            fi

            cd /opt/food-purchase/backend
            node migrations/migrate.js up 2>&1 || echo "⚠️ migrate.js up had errors, continuing..."

            # 历史数据修复脚本（幂等，失败不中断部署）
            node fix-checkin-data.js 2>&1 || echo "⚠️ fix-checkin-data failed, continuing..."
            node fix-worker-names.js 2>&1 || echo "⚠️ fix-worker-names failed, continuing..."
            node fix-signature-data.js 2>&1 || echo "⚠️ fix-signature-data failed, continuing..."
            node fix-scan-inbound-missing.js 2>&1 || echo "⚠️ fix-scan-inbound-missing failed, continuing..."
            node fix-scan-inbound-instant-use.js 2>&1 || echo "⚠️ fix-scan-inbound-instant-use failed, continuing..."
            node fix-dedup-expense.js 2>&1 || echo "⚠️ fix-dedup-expense failed, continuing..."
            node fix-dedup-expense-v2.js 2>&1 || echo "⚠️ fix-dedup-expense-v2 failed, continuing..."
            node fix-instant-use-expense.js 2>&1 || echo "⚠️ fix-instant-use-expense failed, continuing..."
            node scripts/update_clinical_significance.js 2>&1 || echo "⚠️ update_clinical_significance failed, continuing..."
            node scripts/recalc-package-role-plans.js --apply 2>&1 || echo "⚠️ recalc-package-role-plans failed, continuing..."
            echo "✅ Migrations & data fixes done"

  # ================================================================
  # Job 5/5: restart — systemctl restart + 多轮 health check
  # ================================================================
  restart:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Restart backend & health check via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "🔄 Restarting backend service..."
            sudo systemctl restart food-purchase-backend || echo "⚠️ systemctl restart failed, trying alternative..."
            sleep 5
            for i in 1 2 3 4 5; do
              if curl -s http://127.0.0.1:3001/api/health; then
                echo "✅ Backend service is healthy (attempt $i/5)"
                exit 0
              fi
              echo "  Waiting for backend... attempt $i/5"
              sleep 3
            done
            echo "❌ Backend did not become healthy"
            exit 1
