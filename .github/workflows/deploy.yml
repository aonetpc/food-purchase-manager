name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/food-purchase-manager
            # 强制同步远程分支（避免分支分歧导致pull失败）
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            sudo rm -rf /var/www/food-purchase/*
            sudo cp -r dist/* /var/www/food-purchase/
            sudo chown -R ubuntu:ubuntu /var/www/food-purchase
            sudo cp backend/package.json /opt/food-purchase/backend/
            sudo cp backend/package-lock.json /opt/food-purchase/backend/
            sudo cp backend/server.js /opt/food-purchase/backend/
            sudo cp backend/db.js /opt/food-purchase/backend/
            sudo cp backend/fix-checkin-data.js /opt/food-purchase/backend/
            sudo cp backend/fix-worker-names.js /opt/food-purchase/backend/
            sudo cp backend/fix-signature-data.js /opt/food-purchase/backend/
            sudo cp backend/fix-scan-inbound-missing.js /opt/food-purchase/backend/
            sudo cp backend/fix-scan-inbound-instant-use.js /opt/food-purchase/backend/
            sudo cp -r backend/routes/* /opt/food-purchase/backend/routes/
            sudo cp -r backend/middleware/* /opt/food-purchase/backend/middleware/
            sudo cp -r backend/migrations/* /opt/food-purchase/backend/migrations/
            sudo mkdir -p /opt/food-purchase/backend/scripts
            sudo cp -r backend/scripts/* /opt/food-purchase/backend/scripts/
            sudo mkdir -p /opt/food-purchase/backend/utils
            sudo cp -r backend/utils/. /opt/food-purchase/backend/utils/
            sudo cp -r backend/fonts /opt/food-purchase/backend/
            sudo chown -R ubuntu:ubuntu /opt/food-purchase/backend
            cd /opt/food-purchase/backend
            npm ci --production
            # 数据库迁移：创建suppliers表（如果不存在）
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              CREATE TABLE IF NOT EXISTS suppliers (
                id VARCHAR(36) PRIMARY KEY,
                name VARCHAR(100) NOT NULL,
                contact VARCHAR(50),
                phone VARCHAR(20),
                address VARCHAR(200),
                sort_order INT DEFAULT 0,
                created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
              );
            " 2>/dev/null || true

            # 数据库迁移：确保 purchase_records 表有 department_id 和 department_name 字段
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'purchase_records';
              SET @columnname = 'department_id';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' VARCHAR(36)')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;

              SET @columnname = 'department_name';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' VARCHAR(50)')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;

              SET @indexname = 'idx_department';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND index_name = @indexname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD INDEX ', @indexname, ' (department_id)')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;
            " 2>/dev/null || true

            # 数据库迁移：确保 purchase_records 表有 supplier_id 和 supplier_name 字段
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'purchase_records';
              SET @columnname = 'supplier_id';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' VARCHAR(36)')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;

              SET @columnname = 'supplier_name';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' VARCHAR(100)')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;

              SET @indexname = 'idx_supplier';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND index_name = @indexname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD INDEX ', @indexname, ' (supplier_id)')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;
            " 2>/dev/null || true

            # 数据库迁移：批量更新未指定供应商的记录为默认供应商
            # 如果供应商表为空则不更新，COALESCE确保安全
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              UPDATE purchase_records
              SET supplier_id = COALESCE((SELECT id FROM suppliers ORDER BY sort_order ASC LIMIT 1), supplier_id),
                  supplier_name = COALESCE((SELECT name FROM suppliers ORDER BY sort_order ASC LIMIT 1), supplier_name)
              WHERE supplier_id IS NULL OR supplier_id = '';
            " 2>/dev/null || true

            # 数据库迁移：移除可能存在的唯一约束，允许同一食材同一天多条记录
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'purchase_records';
              SET @idx_uniq_date_ing = 'idx_unique_date_ingredient';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND index_name = @idx_uniq_date_ing) > 0,
                CONCAT('ALTER TABLE ', @tablename, ' DROP INDEX ', @idx_uniq_date_ing),
                'SELECT 1'
              ));
              PREPARE dropIfExists FROM @preparedStatement;
              EXECUTE dropIfExists;
              DEALLOCATE PREPARE dropIfExists;
            " 2>/dev/null || true

            # 数据库迁移：创建 wecom_config 表（如果不存在）
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              CREATE TABLE IF NOT EXISTS wecom_config (
                id INT PRIMARY KEY DEFAULT 1,
                corp_id VARCHAR(100),
                app_secret VARCHAR(200),
                agent_id VARCHAR(50),
                chat_id VARCHAR(100),
                approval_template_id VARCHAR(100),
                applicant_userid VARCHAR(100),
                payment_options JSON,
                default_payment_key VARCHAR(50),
                payee_name VARCHAR(50),
                bank_name VARCHAR(100),
                bank_account VARCHAR(50),
                payment_reason_template VARCHAR(200),
                callback_token VARCHAR(100),
                callback_aes_key VARCHAR(200),
                approval_field_mapping JSON,
                updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
              );
            " 2>/dev/null || true

            # 数据库迁移：给 wecom_config 表添加 approval_field_mapping 字段
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'wecom_config';
              SET @columnname = 'approval_field_mapping';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' JSON')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;
            " 2>/dev/null || true

            # 数据库迁移：给 wecom_config 表添加 webhook_url 字段
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'wecom_config';
              SET @columnname = 'webhook_url';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' VARCHAR(500)')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;
            " 2>/dev/null || true

            # 数据库迁移：给 wecom_config 表添加 test_webhook_url 字段（测试群机器人URL，与生产webhook_url隔离）
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'wecom_config';
              SET @columnname = 'test_webhook_url';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' VARCHAR(500)')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;
            " 2>/dev/null || true

            # 数据库迁移：创建 wecom_test_messages 表（测试消息表，与生产数据完全隔离）
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              CREATE TABLE IF NOT EXISTS wecom_test_messages (
                id VARCHAR(36) PRIMARY KEY,
                test_date DATE NOT NULL,
                total_amount DECIMAL(12,2) NOT NULL DEFAULT 0,
                departments JSON,
                purchase_items JSON,
                message_content TEXT,
                status VARCHAR(20) DEFAULT 'pending',
                confirmed_by VARCHAR(100),
                confirmed_at DATETIME,
                rejected_by VARCHAR(100),
                rejected_at DATETIME,
                reject_reason TEXT,
                wecom_sent TINYINT DEFAULT 0,
                sent_at DATETIME,
                created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                updated_at DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                INDEX idx_test_date (test_date),
                INDEX idx_status (status)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
            " 2>/dev/null || true

            # 数据库迁移：创建 wecom_callback_logs 表（如果不存在）
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              CREATE TABLE IF NOT EXISTS wecom_callback_logs (
                id INT AUTO_INCREMENT PRIMARY KEY,
                message_type VARCHAR(50) NOT NULL,
                content TEXT,
                chat_id VARCHAR(100),
                from_user VARCHAR(100),
                msg_type VARCHAR(50),
                event VARCHAR(50),
                created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );
            " 2>/dev/null || true

            # 数据库迁移：创建 purchase_confirmations 表（如果不存在）
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              CREATE TABLE IF NOT EXISTS purchase_confirmations (
                id VARCHAR(36) PRIMARY KEY,
                purchase_date DATE NOT NULL,
                total_amount DECIMAL(10,2) NOT NULL,
                departments JSON NOT NULL,
                purchase_items JSON NOT NULL,
                status ENUM('pending','confirmed','rejected','completed','reimbursed') DEFAULT 'pending',
                confirmed_by VARCHAR(100),
                confirmed_at DATETIME,
                wecom_msg_id VARCHAR(100),
                reimbursement_no VARCHAR(100),
                reimbursement_status ENUM('pending','approved','rejected','null') DEFAULT 'pending',
                rejection_reason TEXT,
                created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
              );
            " 2>/dev/null || true

            # 数据库迁移：给 purchase_confirmations 表添加 confirmed_by 字段（如果不存在）
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'purchase_confirmations';
              SET @columnname = 'confirmed_by';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' VARCHAR(100)')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;
            " 2>/dev/null || true

            # 数据库迁移：给 purchase_confirmations 表添加 confirmed_at 字段（如果不存在）
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'purchase_confirmations';
              SET @columnname = 'confirmed_at';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' DATETIME')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;
            " 2>/dev/null || true

            # 数据库迁移：给 departments 表添加 confirmer_userid 字段（如果不存在）
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'departments';
              SET @columnname = 'confirmer_userid';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' VARCHAR(100)')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;
            " 2>/dev/null || true

            # 数据库迁移：给 purchase_confirmations 表添加 pdf_url 字段（如果不存在）
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'purchase_confirmations';
              SET @columnname = 'pdf_url';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' VARCHAR(255)')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;
            " 2>/dev/null || true

            # 数据库迁移：给 purchase_confirmations 表添加 confirmed_signatures 字段（如果不存在）
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'purchase_confirmations';
              SET @columnname = 'confirmed_signatures';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' JSON')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;
            " 2>/dev/null || true

            # 数据库迁移：给 purchase_confirmations 表添加 reimbursement_sp_no 字段（如果不存在）
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'purchase_confirmations';
              SET @columnname = 'reimbursement_sp_no';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' VARCHAR(100)')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;
            " 2>/dev/null || true

            # 数据库迁移：给 purchase_confirmations 表添加 approval_detail 字段（如果不存在）
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'purchase_confirmations';
              SET @columnname = 'approval_detail';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' JSON')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;
            " 2>/dev/null || true

            # 数据库迁移：更新 status 字段添加 'reimbursing' 值
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              ALTER TABLE purchase_confirmations MODIFY COLUMN status ENUM('pending','confirmed','rejected','completed','reimbursed','reimbursing') DEFAULT 'pending';
            " 2>/dev/null || true

            # 数据库迁移：更新 reimbursement_status 字段添加 'processing' 值
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              ALTER TABLE purchase_confirmations MODIFY COLUMN reimbursement_status ENUM('pending','approved','rejected','processing','null') DEFAULT 'pending';
            " 2>/dev/null || true

            # 数据库迁移：给 wecom_test_messages 表添加 pdf_url 字段（如果不存在）
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'wecom_test_messages';
              SET @columnname = 'pdf_url';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' VARCHAR(500)')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;
            " 2>/dev/null || true

            # 创建PDF存储目录
            mkdir -p /opt/food-purchase/backend/uploads/pdfs
            chmod 755 /opt/food-purchase/backend/uploads/pdfs

            # 数据库迁移：确保 warehouse_purchase_items 表有 warehouse_id 和 warehouse_name 字段（明细级仓库）
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'warehouse_purchase_items';

              SET @columnname = 'warehouse_id';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' VARCHAR(36) NULL COMMENT \"入库仓库ID（明细级）\"')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;

              SET @columnname = 'warehouse_name';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' VARCHAR(100) NULL COMMENT \"入库仓库名称\"')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;

              SET @indexname = 'idx_wpi_warehouse';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND index_name = @indexname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD INDEX ', @indexname, ' (warehouse_id)')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;
            " 2>/dev/null || true

            # 数据库迁移：确保 warehouse_purchases 表的 warehouse_id 改为可空
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'warehouse_purchases';
              SET @columnname = 'warehouse_id';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname
                  AND is_nullable = 'YES') > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' MODIFY COLUMN ', @columnname, ' VARCHAR(36) NULL COMMENT \"已废弃，使用明细行的warehouse_id\"')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;

              SET @columnname = 'warehouse_name';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname
                  AND is_nullable = 'YES') > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' MODIFY COLUMN ', @columnname, ' VARCHAR(100) NULL')
              ));
              PREPARE alterIfNotExists FROM @preparedStatement;
              EXECUTE alterIfNotExists;
              DEALLOCATE PREPARE alterIfNotExists;
            " 2>/dev/null || true

            # 数据库迁移：确保 stock_movements 表有 department_id 和 department_name 字段
            mysql -u food_purchase -p'food_purchase123' food_purchase -e "
              SET @dbname = DATABASE();
              SET @tablename = 'stock_movements';

              SET @columnname = 'department_id';
              SET @preparedStatement = (SELECT IF(
                (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE table_schema = @dbname
                  AND table_name = @tablename
                  AND column_name = @columnname) > 0,
                'SELECT 1',
                CONCAT('ALTER TABLE ', @tablename, ' ADD COLUMN ', @columnname, ' VARCHAR(36) NULL COMMENT \"归集部门ID（出库/盘点必填）\"')
              ));
