            # 兜底1：mysql --force 管道模式（--force 保证单条语句报错不中断后续语句，错误输出到 stdout）
            # 重要：跳过 *_DONE.sql 后缀文件——这些是一次性迁移（删库+全量重插/分类映射/数据纠正），
            #       若每次部署都重复执行会清掉用户修改过的体检项目/套餐明细数据
            # 二次保险：即使有人忘了改名 _DONE，只要 SQL 里含对 booking_checkup_items / booking_checkup_packages
