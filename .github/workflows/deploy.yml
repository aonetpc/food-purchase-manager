name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/food-purchase-manager
            git pull origin main
            npm install
            npm run build
            cp -r dist/* /var/www/food-purchase/
            cp backend/package.json /opt/food-purchase/backend/
            cp backend/server.js /opt/food-purchase/backend/
            cp backend/db.js /opt/food-purchase/backend/
            cp -r backend/routes/* /opt/food-purchase/backend/routes/
            cd /opt/food-purchase/backend
            npm install --production
            sudo systemctl restart food-purchase-backend
            sleep 2
            curl -s http://127.0.0.1:3001/api/health
